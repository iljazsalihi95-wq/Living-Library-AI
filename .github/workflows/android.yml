name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name "$(grep '^name:' pubspec.yaml | awk '{print $2}')" .
      - name: Install Android API 36 and set compileSdk
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text().replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
          p.write_text(s)
          PY
      - name: Check Android package identity for update compatibility
        run: |
          grep -n 'applicationId' android/app/build.gradle.kts
          echo '::notice::Existing install updates require matching package ID and signing certificate.'
      - name: Generate original launcher icons
        run: |
          python3 -m pip install --user Pillow
          python3 scripts/generate_launcher_icons.py
      - name: Prevent default Flutter adaptive icon overriding branded icon
        run: |
          # Flutter's generated adaptive launcher can take precedence on Android 8+.
          # Use our custom mipmap PNGs consistently, including Samsung One UI.
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test ! -e android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
      - name: Verify custom launcher icons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          for density, size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              path = Path(f'android/app/src/main/res/mipmap-{density}/ic_launcher.png')
              assert path.is_file(), f'Missing {path}'
              with Image.open(path) as icon:
                  assert icon.size == (size, size), f'Invalid icon size: {path}'
                  rgb = icon.convert('RGB')
                  colors = rgb.getcolors(maxcolors=size * size)
                  assert colors is not None and len(colors) >= 3, f'Blank or placeholder icon: {path}'
                  assert any(r > 130 and g > 90 and b < 180 for _, (r, g, b) in colors), f'Branded gold accent missing: {path}'
          print('All five branded Android launcher icons verified')
          PY
      - name: Audit optional pilot frames without blocking general library builds
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          frames = sorted(Path('assets/story').glob('frame_*.jpg'))
          if len(frames) != 22:
              print(f'::warning::Pilot film has {len(frames)}/22 frames. The general library APK will build; film rendering stays unavailable.')
          for frame in frames:
              with Image.open(frame) as im:
                  im.verify()
          print(f'Validated {len(frames)} existing pilot images')
          PY
      - name: Test private pilot packaging without owner photographs
        run: python3 -m unittest discover -s scripts -p 'test_prepare_private_pilot.py'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build universal debug APK
        run: flutter build apk --debug
      - name: Build Samsung S23 arm64 APK
        run: flutter build apk --debug --split-per-abi
      - name: Verify compiled launcher resources
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          test -s "$APK"
          unzip -Z1 "$APK" | grep -E 'res/.*png' | head -5
          echo "Compiled Android PNG resources present"
      - name: Verify APKs and produce SHA-256 checksums
        run: |
          set -e
          OUT=build/app/outputs/flutter-apk
          test -s "$OUT/app-debug.apk"
          test -s "$OUT/app-arm64-v8a-debug.apk"
          unzip -l "$OUT/app-arm64-v8a-debug.apk" | grep -q 'lib/arm64-v8a/libflutter.so'
          cd "$OUT"
          sha256sum app-debug.apk > app-debug.apk.sha256
          sha256sum app-arm64-v8a-debug.apk > app-arm64-v8a-debug.apk.sha256
          ls -lh app-debug.apk app-arm64-v8a-debug.apk
          echo 'Samsung S23 arm64-v8a APK verified'
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: samsung-s23-arm64-debug-apk
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk.sha256
